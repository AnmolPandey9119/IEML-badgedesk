<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Login — IEML BadgeDesk</title>
  <link rel="icon" type="image/png" href="assets/ieml-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      background: var(--brand-gradient);
      position: relative;
      overflow: hidden;
    }
    .login-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(600px 400px at 12% 15%, rgba(255,255,255,0.10), transparent 60%),
        radial-gradient(500px 380px at 88% 85%, rgba(31,138,140,0.35), transparent 60%);
      pointer-events: none;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
      animation: login-rise 0.45s ease both;
      border-top: 3px solid var(--secondary);
      text-align: center;
    }
    @keyframes login-rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }
    .login-card .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin: 0 0 22px;
    }
    .login-card form { text-align: left; }
    #login-error {
      background: var(--error-bg);
      color: var(--danger);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
      text-align: left;
    }
    .login-logo {
      display: block;
      height: 60px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      margin: 0 auto 14px;
      filter: drop-shadow(0 4px 10px rgba(12,45,82,0.15));
    }
    .master-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <section class="card login-card">
      <img src="assets/ieml-logo.png" alt="IEML" class="login-logo" onerror="this.style.display='none'" />
      <span class="master-badge">Master Console</span>
      <h1>IEML BadgeDesk</h1>
      <p class="subtitle">Master access only — manage registrations, print stats, and records.</p>

      <div id="login-error" class="hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" required autofocus autocomplete="username" />
        </div>
        <div class="form-group" style="margin-top: 12px;">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 18px;">
          Login
        </button>
      </form>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
