<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Entrance Scanner — IEML BadgeDesk</title>
  <link rel="icon" type="image/png" href="assets/ieml-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    if (!sessionStorage.getItem("ieml_scanner_token")) {
      window.location.href = "scan-login.html";
    }
  </script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <img src="assets/ieml-logo.png" alt="IEML" class="topbar-logo" onerror="this.style.display='none'" />
      <div class="topbar-title">
        <h1>Entrance Scanner</h1>
        <span id="event-name" class="event-name">Loading event...</span>
      </div>
    </div>
    <div class="topbar-right">
      <span id="connection-status" class="status status-checking">...</span>
      <button id="logout-btn" class="btn-topbar">Logout</button>
    </div>
  </header>

  <div class="scanner-name-row">
    Scanner: <span id="scanner-name-chip" class="scanner-name-chip">—</span>
    <button id="change-scanner-name-btn" class="scanner-name-edit">Change</button>
  </div>

  <main class="scan-container">
    <div id="qr-reader"></div>
    <p id="scan-hint" class="scan-placeholder">Point the camera at a badge QR code</p>

    <div id="result-area"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
