<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Scanner Login — IEML BadgeDesk</title>
  <script src="js/console-guard.js"></script>
  <link rel="icon" type="image/png" href="assets/ieml-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-wrap {
      position: relative;
      background: url('assets/login-bg.jpg') center center / cover no-repeat;
    }
    .login-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 14, 24, 0.72), rgba(10, 14, 24, 0.82));
    }
    .login-card {
      position: relative;
      z-index: 1;
      background: rgba(27, 30, 38, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .login-card h1,
    .login-card label {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <section class="login-card">
      <img src="assets/ieml-logo.png" alt="IEML" class="login-logo" onerror="this.style.display='none'" />
      <span class="scanner-badge">Entrance Scanner</span>
      <h1>IEML BadgeDesk</h1>
      <p class="subtitle">Login to start scanning badges at your gate.</p>

      <div id="login-error" class="login-error-box hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" required autofocus autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit" id="login-btn" class="login-submit-btn">Login</button>
      </form>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
