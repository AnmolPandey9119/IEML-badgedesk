<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — IEML BadgeDesk</title>
  <script src="js/console-guard.js"></script>
  <link rel="icon" type="image/png" href="assets/ieml-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Small page-specific layout, kept out of style.css since
       nothing else on the site needs a centered single card. */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      background: url('assets/login-bg.jpg') center center / cover no-repeat;
    }
    .login-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 14, 24, 0.72), rgba(10, 14, 24, 0.82));
    }
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: rgba(27, 30, 38, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .login-card h1,
    .login-card label {
      color: #fff;
    }
    .login-card h1 {
      font-size: 19px;
      margin: 0 0 4px;
    }
    .login-card .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin: 0 0 20px;
    }
    #login-error {
      background: var(--error-bg);
      color: var(--danger);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .login-logo {
      display: block;
      height: 56px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <section class="card login-card">
      <img src="assets/ieml-logo.png" alt="IEML" class="login-logo" onerror="this.style.display='none'" />
      <h1>IEML BadgeDesk</h1>
      <p class="subtitle">Counter operator login — required before searching, registering, or printing badges.</p>

      <div id="login-error" class="hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" name="username" required autofocus autocomplete="username" />
        </div>
        <div class="form-group" style="margin-top: 12px;">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 18px;">
          Login
        </button>
      </form>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
